# Pushing a tag vX.Y.Z runs the tests, builds both packages, checksums and
# attests them, and publishes a GitHub release with the notes from CHANGELOG.md.
# A tag with a suffix (v0.2.0-rc.1) becomes a pre-release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version and the changelog has its notes
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Directory.Build.props"; exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

  # The same checks as CI, on the tagged commit.
  test:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.js
      - run: node tests/null-experiments.mjs
      - run: node tests/score-calibration.mjs
      - run: dotnet run --project tests/bridge/BridgeChecks.csproj -c Release

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        shell: pwsh
        run: ./scripts/Publish.ps1 -Runtime win-x64
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/IntentionLab -DestinationPath "IntentionLab-$($env:GITHUB_REF_NAME.TrimStart('v'))-win-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: IntentionLab-*-win-x64.zip
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        shell: pwsh
        run: ./scripts/Publish.ps1 -Runtime linux-x64
      - name: Package
        run: |
          chmod +x dist/IntentionLab-linux-x64/DeviceBridge
          tar -czf "IntentionLab-${GITHUB_REF_NAME#v}-linux-x64.tar.gz" -C dist IntentionLab-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: IntentionLab-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        working-directory: packages
        run: sha256sum IntentionLab-* > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: packages/IntentionLab-*
      - name: Release notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { f = 0 }
            f' CHANGELOG.md > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" packages/* --verify-tag $pre \
            --title "Intention Lab ${GITHUB_REF_NAME#v}" --notes-file notes.md
